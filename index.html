<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Gestionare produse</title>
  <style>
    /* Stil de scriere: Google HTML/CSS Style Guide
       https://google.github.io/styleguide/htmlcssguide.html */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f2f5;
      color: #1f2937;
      line-height: 1.6;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 28px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      padding: 24px;
      margin-bottom: 24px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .btn-edit {
      background: #f59e0b;
      color: #fff;
      padding: 4px 10px;
    }

    .btn-delete {
      background: #dc2626;
      color: #fff;
      padding: 4px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f9fafb;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .message.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #empty-message {
      text-align: center;
      color: #6b7280;
      padding: 16px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Gestionare produse</h1>

    <section class="card">
      <h2 id="form-title">Adaugă produs</h2>
      <form id="product-form">
        <div>
          <label for="name">Nume</label>
          <input type="text" id="name" required>
        </div>
        <div>
          <label for="price">Preț (RON)</label>
          <input type="number" id="price" min="0" step="0.01" required>
        </div>
        <div>
          <label for="description">Descriere</label>
          <textarea id="description" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-button">
            Salvează
          </button>
          <button type="button" class="btn-secondary" id="cancel-button"
              hidden>Anulează</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <h2>Produse</h2>
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Nume</th>
            <th>Preț</th>
            <th>Descriere</th>
            <th>Acțiuni</th>
          </tr>
        </thead>
        <tbody id="products-tbody"></tbody>
      </table>
      <p id="empty-message">Nu există produse. Adaugă primul produs mai sus.</p>
    </section>
  </main>

  <script>
    'use strict';

    /**
     * Aplicația frontend pentru gestionarea produselor.
     * Comunica cu API-ul REST expus de backend prin fetch.
     * Stil de scriere: Google JavaScript Style Guide
     * https://google.github.io/styleguide/jsguide.html
     */

    const API_URL = 'http://localhost:3000/api/products';
    let editingId = null;

    const form = document.getElementById('product-form');
    const nameInput = document.getElementById('name');
    const priceInput = document.getElementById('price');
    const descriptionInput = document.getElementById('description');
    const submitButton = document.getElementById('submit-button');
    const cancelButton = document.getElementById('cancel-button');
    const formTitle = document.getElementById('form-title');
    const tableBody = document.getElementById('products-tbody');
    const emptyMessage = document.getElementById('empty-message');
    const messageBox = document.getElementById('message');

    /**
     * Afișează un mesaj de succes sau de eroare.
     * @param {string} text Mesajul afișat.
     * @param {string} type Tipul mesajului: 'success' sau 'error'.
     */
    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'message ' + type;
    }

    /** Ascunde mesajul afișat anterior. */
    function hideMessage() {
      messageBox.className = 'message';
      messageBox.textContent = '';
    }

    /** Resetează formularul în modul "adaugă produs". */
    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = 'Adaugă produs';
      submitButton.textContent = 'Salvează';
      cancelButton.hidden = true;
    }

    /**
     * Încarcă produsele de la API și le afișează în tabel.
     */
    async function loadProducts() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error('Nu s-au putut încărca produsele.');
        }
        renderProducts(await response.json());
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    /**
     * Construiește rândurile tabelului pe baza produselor primite.
     * @param {!Array<!Object>} products Lista de produse.
     */
    function renderProducts(products) {
      tableBody.textContent = '';
      emptyMessage.hidden = products.length > 0;
      for (const product of products) {
        tableBody.appendChild(createRow(product));
      }
    }

    /**
     * Creează un rând din tabel pentru un produs.
     * @param {!Object} product Produsul afișat.
     * @return {!HTMLTableRowElement} Rândul creat.
     */
    function createRow(product) {
      const row = document.createElement('tr');
      const cells = [
        product.id,
        product.name,
        product.price.toFixed(2) + ' RON',
        product.description,
      ];
      for (const text of cells) {
        const cell = document.createElement('td');
        cell.textContent = text;
        row.appendChild(cell);
      }
      const actions = document.createElement('td');
      actions.appendChild(createEditButton(product));
      actions.appendChild(createDeleteButton(product));
      row.appendChild(actions);
      return row;
    }

    /**
     * Creează butonul de editare pentru un produs.
     * @param {!Object} product Produsul editat la apăsarea butonului.
     * @return {!HTMLButtonElement} Butonul creat.
     */
    function createEditButton(product) {
      const button = document.createElement('button');
      button.textContent = 'Editare';
      button.className = 'btn-edit';
      button.addEventListener('click', () => startEdit(product));
      return button;
    }

    /**
     * Creează butonul de ștergere pentru un produs.
     * @param {!Object} product Produsul șters la apăsarea butonului.
     * @return {!HTMLButtonElement} Butonul creat.
     */
    function createDeleteButton(product) {
      const button = document.createElement('button');
      button.textContent = 'Șterge';
      button.className = 'btn-delete';
      button.addEventListener('click', () => deleteProduct(product));
      return button;
    }

    /**
     * Pune formularul în modul de editare pentru un produs.
     * @param {!Object} product Produsul care va fi editat.
     */
    function startEdit(product) {
      editingId = product.id;
      nameInput.value = product.name;
      priceInput.value = product.price;
      descriptionInput.value = product.description;
      formTitle.textContent = 'Editează produsul #' + product.id;
      submitButton.textContent = 'Actualizează';
      cancelButton.hidden = false;
      window.scrollTo(0, 0);
    }

    /**
     * Șterge un produs după confirmarea utilizatorului.
     * @param {!Object} product Produsul care va fi șters.
     */
    async function deleteProduct(product) {
      if (!confirm('Sigur vrei să ștergi produsul "' + product.name + '"?')) {
        return;
      }
      try {
        const response = await fetch(API_URL + '/' + product.id, {
          method: 'DELETE',
        });
        if (!response.ok) {
          throw new Error('Produsul nu a putut fi șters.');
        }
        showMessage('Produs șters cu succes.', 'success');
        await loadProducts();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();
      const product = {
        name: nameInput.value.trim(),
        price: parseFloat(priceInput.value),
        description: descriptionInput.value.trim(),
      };
      try {
        const response = await fetch(
            editingId === null ? API_URL : API_URL + '/' + editingId, {
          method: editingId === null ? 'POST' : 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(product),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Operația a eșuat.');
        }
        showMessage(
            editingId === null ? 'Produs adăugat cu succes.'
                : 'Produs actualizat cu succes.', 'success');
        resetForm();
        await loadProducts();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    });

    cancelButton.addEventListener('click', resetForm);

    loadProducts();
  </script>
</body>
</html>
